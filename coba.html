<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keranjang Belanja | Kafe Saya</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Lightbox2 CSS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/css/lightbox.min.css" rel="stylesheet">

  <style>
    .main-color {
      background-color: #212529 !important;
    }

    .table img {
      object-fit: cover;
    }

    .btn-warning {
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark main-color">
    <div class="container-fluid">
      
      <!-- Tombol hamburger mobile -->
      <button class="navbar-toggler" type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Menu Navbar -->
      <div class="collapse navbar-collapse" id="navbarNav">
        <a class="navbar-brand me-auto" href="#">Kafe Saya</a>

        <ul class="navbar-nav">
          <li class="nav-item me-5">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item me-5">
            <a class="nav-link" href="menu.html">Menu</a>
          </li>
          <li class="nav-item me-5">
            <a class="nav-link active" href="keranjang.html">Keranjang</a>
          </li>
          <li class="nav-item me-5">
            <a class="nav-link" href="kontak.html">Kontak</a>
          </li>
        </ul>
      </div>

    </div>
  </nav>

  <!-- MAIN TABLE / KERANJANG -->
  <div class="container-fluid py-5">
    <div class="container">
      <h2 class="text-center my-5">Keranjang Belanja</h2>

      <div class="table-responsive">
        <table class="table table-bordered align-middle text-center">
          <tr>
            <th>#</th>
            <th>Pesanan</th>
            <th>Harga</th>
            <th>Jumlah</th>
            <th>Total</th>
          </tr>

          <!-- Produk 1 -->
          <tr style="vertical-align: middle;">
            <td>
              <a href="image/french-fries.jpg" data-lightbox="keranjang" data-title="French Fries">
                <img src="image/french-fries.jpg" width="150px" class="img-thumbnail d-sm-block d-none" alt="French Fries">
                <label class="d-block d-sm-none">French Fries</label>
              </a>
            </td>
            <td>French Fries</td>
            <td>Rp 25.000</td>
            <td>2</td>
            <td>Rp 50.000</td>
          </tr>

          <!-- Produk 2 -->
          <tr style="vertical-align: middle;">
            <td>
              <a href="image/burger.jpg" data-lightbox="keranjang" data-title="Burger Spesial">
                <img src="image/burger.jpg" width="150px" class="img-thumbnail d-sm-block d-none" alt="Burger Spesial">
                <label class="d-block d-sm-none">Burger Spesial</label>
              </a>
            </td>
            <td>Burger Spesial</td>
            <td>Rp 40.000</td>
            <td>1</td>
            <td>Rp 40.000</td>
          </tr>

          <!-- Produk 3 -->
          <tr style="vertical-align: middle;">
            <td>
              <a href="image/es-teh.jpg" data-lightbox="keranjang" data-title="Es Teh Manis">
                <img src="image/es-teh.jpg" width="150px" class="img-thumbnail d-sm-block d-none" alt="Es Teh Manis">
                <label class="d-block d-sm-none">Es Teh Manis</label>
              </a>
            </td>
            <td>Es Teh Manis</td>
            <td>Rp 10.000</td>
            <td>3</td>
            <td>Rp 30.000</td>
          </tr>

          <!-- Total -->
          <tr>
            <th colspan="4" class="text-end">Total:</th>
            <th>Rp 120.000</th>
          </tr>
        </table>
      </div>

      <!-- Tombol Checkout -->
      <div class="text-end">
        <button class="btn btn-warning text-light px-4">Checkout</button>
      </div>

    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Lightbox2 JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/js/lightbox.min.js"></script>

</body>
</html>
